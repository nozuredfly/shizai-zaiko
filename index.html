<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="資材在庫">
<meta name="theme-color" content="#2f6b3a">
<title>資材販売・在庫管理</title>
<link rel="apple-touch-icon" id="appleIcon" href="">
<link rel="manifest" id="manifestLink" href="">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--g:#2f6b3a;--g2:#e7f0e4;--bg:#f4f6f2;--card:#fff;--tx:#222;--sub:#666;--line:#ddd;--warn:#c0392b;--amber:#b9770e;--blue:#1f4e8c}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;margin:0}
#mode{font-size:11px;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:10px}
main{max-width:720px;margin:0 auto;padding:12px 16px}
section{display:none}section.on{display:block}
h2{font-size:16px;margin:16px 0 8px;color:var(--g)}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum .card{margin:0;text-align:center;padding:10px 6px}.sum b{font-size:19px;display:block}
.stockItem{display:flex;justify-content:space-between;align-items:center}
.stockItem .m{font-size:20px;font-weight:700}
.stockItem .n{font-size:28px;font-weight:700;text-align:right}
.stockItem .n small{font-size:13px;font-weight:400;color:var(--sub)}
.low{border-left:6px solid var(--warn)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;color:#fff;background:#888;white-space:nowrap}
.t-in{background:var(--g)}.t-use{background:var(--amber)}.t-sale{background:var(--blue)}.t-cnt{background:#777}
.b-warn{background:var(--warn)}.b-ok{background:#3c8d50}.b-gray{background:#999}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--tx)}
textarea{min-height:56px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font-size:15px;border:none;border-radius:8px;padding:10px 14px;background:var(--g2);color:var(--g);font-weight:600;cursor:pointer}
button.main{background:var(--g);color:#fff;width:100%;padding:14px;font-size:17px;margin-top:14px}
button.danger{background:#fbe9e7;color:var(--warn)}
button.sm{padding:6px 10px;font-size:13px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{background:#fff;border:2px solid var(--line);color:var(--tx);padding:12px 4px}
.seg button.on{border-color:var(--g);background:var(--g);color:#fff}
.line{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fafafa;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.line select{flex:1 1 150px}.line input{width:84px;flex:0 0 84px}
.line .lInfo{flex-basis:100%;font-size:12px;color:var(--sub)}
.checks{display:flex;gap:14px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;margin:4px 0;color:var(--tx);font-size:15px}
.checks input{width:22px;height:22px}
.money{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:15px}
.money .t{font-weight:700;font-size:18px;border-top:1px solid var(--line);padding-top:4px}
.money span:nth-child(even){text-align:right}
.slip ul{margin:6px 0;padding-left:18px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{background:none;color:var(--sub);border-radius:0;padding:10px 0 8px;font-size:12px;font-weight:500}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--g);font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:90%}
#toast.on{opacity:1}
#load{position:fixed;inset:0;background:rgba(255,255,255,.5);display:none;align-items:center;justify-content:center;z-index:40;font-weight:700;color:var(--g)}
#load.on{display:flex}
#lineWrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;align-items:flex-end;justify-content:center}
#lineWrap.on{display:flex}
#lineWrap .box{background:var(--card);width:100%;max-width:720px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
#lineText{min-height:320px;font-size:15px;line-height:1.5}
button.line-btn{background:#06c755;color:#fff}
@media (prefers-color-scheme:dark){
 :root{--bg:#161a16;--card:#232823;--tx:#eee;--sub:#aaa;--line:#444;--g2:#2c3b2c}
 input,select,textarea{background:#1b1f1b}
 .line{background:#1d221d}
 nav{background:#1d221d}
 .seg button{background:#1d221d}
 nav button.on{color:#8fd19e}
 button{color:#cfe8d3}
 h2{color:#8fd19e}
}
</style>
</head>
<body>
<header><h1>資材販売・在庫管理</h1><span id="mode"></span></header>
<main>

<!-- 在庫 -->
<section id="tab-stock" class="on">
 <div class="sum">
  <div class="card"><span class="sub">今月の販売（税込）</span><b id="sMonth">¥0</b></div>
  <div class="card"><span class="sub">未発送</span><b id="sUnship">0件</b></div>
  <div class="card"><span class="sub">未入金</span><b id="sUnpaid">0件</b></div>
 </div>
 <h2>在庫一覧</h2>
 <div id="stockList"></div>
</section>

<!-- 登録 -->
<section id="tab-entry">
 <div class="seg" id="typeSeg">
  <button data-type="入荷" class="on">入荷</button>
  <button data-type="社内使用">社内使用</button>
  <button data-type="社外販売">社外販売</button>
  <button data-type="棚卸調整">棚卸</button>
 </div>
 <label id="dateLabel">日付</label><input type="date" id="eDate">

 <div id="saleBox" style="display:none">
  <div class="two">
   <div><label>受付経路</label>
    <select id="eChannel"><option>電話</option><option>メール（HPを見て等）</option><option>オンラインストア</option><option>来店・直接</option><option>その他</option></select></div>
   <div><label>受付者</label><input id="eReceiver" list="recvList" placeholder="事務所・社長・社員名"><datalist id="recvList"><option value="事務所"><option value="社長"></datalist></div>
  </div>
  <label>顧客名（お客様）<span id="custHit" class="badge b-ok" style="display:none;margin-left:6px">台帳から入力</span></label><input id="eCustomer" list="custList" placeholder="名前を入れると台帳から電話・住所が入ります" autocomplete="off"><datalist id="custList"></datalist>
  <label>電話番号</label><input id="eTel" type="tel" inputmode="tel">
  <label>住所・お届け先</label><input id="eAddr">
  <div class="two">
   <div><label>配送方法</label>
    <select id="eShip"><option>宅配便で発送</option><option>市内配達（自社・無料）</option><option>来店引取（無料）</option></select></div>
   <div id="feeBox"><label>送料（税抜・円）</label><input id="eFee" type="number" inputmode="numeric" min="0"></div>
  </div>
  <div id="delivBox" class="two">
   <div><label>配達希望日</label><input type="date" id="eDelivDate"></div>
   <div><label>時間帯</label><input id="eDelivTime" list="timeList" placeholder="午前・午後・○時頃"><datalist id="timeList"><option value="午前"><option value="午後"><option value="夕方"><option value="指定なし"></datalist></div>
  </div>
  <label>支払方法</label>
  <select id="ePay"><option>請求書払い</option><option>代引き</option><option>振込（前払い）</option><option>オンライン決済</option><option>現金</option></select>
  <label>事務所で作成する書類</label>
  <div class="checks">
   <label><input type="checkbox" value="見積書">見積書</label>
   <label><input type="checkbox" value="納品書">納品書</label>
   <label><input type="checkbox" value="請求書">請求書</label>
   <label><input type="checkbox" value="領収書">領収書</label>
  </div>
 </div>

 <label id="linesLabel">品目と枚数</label>
 <div id="lines"></div>
 <button type="button" id="addLine" class="sm">＋ 品目を追加</button>

 <div id="moneyBox" class="card" style="display:none;margin-top:12px">
  <div class="money">
   <span>商品代（税抜）</span><span id="mGoods">¥0</span>
   <span>送料（税抜）</span><span id="mFee">¥0</span>
   <span><b>税抜金額</b></span><span><b id="mSub">¥0</b></span>
   <span>消費税（10%）</span><span id="mTax">¥0</span>
   <span class="t">合計金額</span><span class="t" id="mTotal">¥0</span>
  </div>
 </div>

 <label>備考</label><textarea id="eNote" placeholder="仕入先・使用者・使用した機械など"></textarea>
 <button class="main" id="saveEntry">登録する</button>
</section>

<!-- 履歴 -->
<section id="tab-hist">
 <div class="card">
  <b>事務所への送付（Excel）</b>
  <div class="two">
   <div><label>開始日</label><input type="date" id="xFrom"></div>
   <div><label>終了日</label><input type="date" id="xTo"></div>
  </div>
  <div class="checks"><label><input type="checkbox" id="xUnsent" checked>事務所に未送付の販売だけ</label></div>
  <div class="btns">
   <button id="xDownload">Excelをダウンロード</button>
   <button id="xMail">事務所へメール送信</button>
  </div>
 </div>
 <div class="row">
  <select id="hType" style="flex:1"><option value="">区分：すべて</option><option>入荷</option><option>社内使用</option><option>社外販売</option><option>棚卸調整</option></select>
  <select id="hState" style="flex:1"><option value="">状態：すべて</option><option value="ship">未発送</option><option value="paid">未入金</option><option value="sent">事務所未送付</option></select>
 </div>
 <input id="hQ" placeholder="顧客名・型式・伝票番号で検索" style="margin-top:8px">
 <div id="histList" style="margin-top:10px"></div>
</section>

<!-- 品目 -->
<section id="tab-items">
 <h2>品目（爪の種類）</h2>
 <div id="itemList"></div>
 <h2 id="iFormTitle">品目を追加</h2>
 <div class="card">
  <input type="hidden" id="iId">
  <label>型式</label><input id="iModel" placeholder="例：M4、NM6">
  <label>用途・通称</label><input id="iUse" placeholder="例：畑作用、ナタ爪">
  <label>販売単価（税抜・円／枚）</label><input id="iPrice" type="number" inputmode="numeric">
  <label>発注点（この枚数以下で「要発注」）</label><input id="iReorder" type="number" inputmode="numeric">
  <label>並び順</label><input id="iOrder" type="number" inputmode="numeric">
  <label>備考</label><input id="iNote">
  <button class="main" id="saveItem">保存</button>
  <button type="button" id="cancelItem" style="width:100%;margin-top:8px;display:none">キャンセル</button>
 </div>
</section>

<!-- 顧客台帳 -->
<section id="tab-cust">
 <h2>顧客台帳</h2>
 <input id="cuQ" placeholder="名前・ふりがな・電話・住所で検索">
 <div id="custListView" style="margin-top:10px"></div>
 <h2 id="cuFormTitle">顧客を登録</h2>
 <div class="card">
  <input type="hidden" id="cuId">
  <label>顧客名</label><input id="cuName" placeholder="例：〇〇農園">
  <label>ふりがな</label><input id="cuKana">
  <label>電話番号</label><input id="cuTel" type="tel" inputmode="tel">
  <label>住所・お届け先</label><input id="cuAddr">
  <label>備考</label><input id="cuNote" placeholder="例：配達は裏口へ、代引き希望">
  <button class="main" id="saveCust">保存</button>
  <button type="button" id="cancelCust" style="width:100%;margin-top:8px;display:none">キャンセル</button>
 </div>
</section>

<!-- 設定 -->
<section id="tab-set">
 <h2>スプレッドシート連携</h2>
 <div class="card">
  <label>GAS ウェブアプリURL（空欄ならこの端末だけで保存）</label><input id="cUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <label>合言葉（GASに設定した API_KEY）</label><input id="cKey">
  <label>担当者名（この端末で登録する人）</label><input id="cStaff" placeholder="例：野副">
 </div>
 <h2>事務所への送付</h2>
 <div class="card">
  <label>事務所のメールアドレス</label><input id="cOffice" type="email" inputmode="email">
  <label>宅配便の送料（税抜・入力時の初期値）</label><input id="cFee" type="number" inputmode="numeric">
 </div>
 <button class="main" id="saveCfg">設定を保存して再読込</button>
</section>
</main>

<nav>
 <button data-tab="stock" class="on"><span>📦</span>在庫</button>
 <button data-tab="entry"><span>✏️</span>登録</button>
 <button data-tab="hist"><span>📋</span>履歴</button>
 <button data-tab="cust"><span>👥</span>顧客</button>
 <button data-tab="items"><span>⚙️</span>品目</button>
 <button data-tab="set"><span>🔧</span>設定</button>
</nav>
<div id="lineWrap"><div class="box">
 <b>配達者へのLINE指示</b><div class="sub">内容は送る前に書き換えできます</div>
 <textarea id="lineText" style="margin-top:8px"></textarea>
 <div class="btns">
  <button class="line-btn" id="lineCopy">コピー</button>
  <button class="line-btn" id="lineSend">LINEで送る</button>
  <button id="lineClose">閉じる</button>
 </div>
</div></div>
<div id="toast"></div>
<div id="load">通信中…</div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');
const pad=n=>String(n).padStart(2,'0');
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function today(){return ymd(new Date())}
function nowStr(){const d=new Date();return `${today()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function makeSlip(){const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`}

const SIGN={'入荷':1,'社内使用':-1,'社外販売':-1,'棚卸調整':0};
const TCLS={'入荷':'t-in','社内使用':'t-use','社外販売':'t-sale','棚卸調整':'t-cnt'};
const PAID_NOW=['現金','オンライン決済','振込（前払い）'];
let cfg=Object.assign({url:'',key:'',staff:'',office:'',fee:''},LS.get('shizai_cfg',{}));
let DB=Object.assign({items:[],tx:[],customers:[]},LS.get('shizai_cache',{}));
let curType='入荷';

/* ---------- データ層 ---------- */
function seed(){return {customers:[],items:['M4','M1','M6','NM6','NM4'].map((m,i)=>({id:uid(),model:m,use:'',price:0,reorder:0,note:'',order:i+1})),tx:[]}}
function upsertLocal(d,c){const i=d.customers.findIndex(x=>x.id===c.id);if(i>=0)d.customers[i]=c;else d.customers.push(c)}
function localApply(a,p){
 const d=LS.get('shizai_local',null)||seed();d.customers=d.customers||[];
 if(a==='saveItem'){const i=d.items.findIndex(x=>x.id===p.item.id);if(i>=0)d.items[i]=p.item;else d.items.push(p.item)}
 else if(a==='deleteItem'){d.items=d.items.filter(x=>x.id!==p.id)}
 else if(a==='addSlip'){d.tx.push(...p.rows);if(p.customer)upsertLocal(d,p.customer)}
 else if(a==='saveCustomer'){upsertLocal(d,p.customer);if(p.oldName)d.tx.forEach(t=>{if(t.customer===p.oldName)t.customer=p.customer.name})}
 else if(a==='deleteCustomer'){d.customers=d.customers.filter(x=>x.id!==p.id)}
 else if(a==='updateSlip'){d.tx.forEach(t=>{if(t.slip===p.slip)Object.assign(t,p.fields)})}
 else if(a==='deleteSlip'){d.tx=d.tx.filter(t=>t.slip!==p.slip)}
 else if(a==='sendOffice'){throw new Error('メール送信はスプレッドシート連携時のみ使えます')}
 LS.set('shizai_local',d);return d;
}
async function api(a,p={}){
 if(!cfg.url){try{DB=localApply(a,p)}catch(e){toast(e.message);throw e}LS.set('shizai_cache',DB);return DB}
 $('#load').classList.add('on');
 try{
  let r;
  if(a==='getAll') r=await fetch(cfg.url+'?key='+encodeURIComponent(cfg.key));
  else r=await fetch(cfg.url,{method:'POST',body:JSON.stringify(Object.assign({action:a,key:cfg.key},p))});
  const j=await r.json();
  if(j.error) throw new Error(j.error);
  DB={items:j.items,tx:j.tx,customers:j.customers||[]};LS.set('shizai_cache',DB);return j;
 }catch(e){toast('エラー：'+e.message);throw e}
 finally{$('#load').classList.remove('on')}
}

/* ---------- 計算 ---------- */
function items(){return [...DB.items].sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0))}
function stockMap(){const m={};DB.items.forEach(i=>m[i.id]=0);DB.tx.forEach(t=>{if(t.itemId)m[t.itemId]=(m[t.itemId]||0)+Number(t.qty||0)});return m}
function slips(){const g={};DB.tx.forEach(t=>{(g[t.slip]=g[t.slip]||[]).push(t)});return Object.values(g).sort((a,b)=>String(b[0].created).localeCompare(String(a[0].created)))}
function money(goods,fee){const sub=goods+fee,tax=Math.floor(sub*0.1);return {goods,fee,sub,tax,total:sub+tax}}
function slipMoney(rows){return money(rows.reduce((s,t)=>s+Math.abs(Number(t.qty))*Number(t.price||0),0),Number(rows[0].shipFee||0))}
const isSale=r=>r[0].type==='社外販売';

/* ---------- 画面 ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3000)}
function renderAll(){$('#mode').textContent=cfg.url?'シート連携':'この端末のみ';renderStock();renderHist();renderItems();renderCust();renderCustList();$$('.line').forEach(refreshLine);calcPreview()}

function renderStock(){
 const st=stockMap(),m=today().slice(0,7),sl=slips().filter(isSale);
 $('#sMonth').textContent=yen(sl.filter(r=>String(r[0].date).startsWith(m)).reduce((s,r)=>s+slipMoney(r).total,0));
 $('#sUnship').textContent=sl.filter(r=>r[0].shipped!=='済').length+'件';
 $('#sUnpaid').textContent=sl.filter(r=>r[0].paid!=='済').length+'件';
 $('#stockList').innerHTML=items().map(i=>{
  const n=st[i.id]||0,low=Number(i.reorder)>0&&n<=Number(i.reorder);
  return `<div class="card stockItem ${low?'low':''}"><div><div class="m">${esc(i.model)}</div><div class="sub">${esc(i.use)||'　'}${low?' <span class="badge b-warn">要発注</span>':''}</div></div><div class="n">${n}<small> 枚</small></div></div>`
 }).join('')||'<div class="card sub">品目がありません。「品目」から追加してください。</div>';
}

/* ----- 登録 ----- */
function itemOptions(sel){return '<option value="">品目を選択</option>'+items().map(i=>`<option value="${esc(i.id)}" ${i.id===sel?'selected':''}>${esc(i.model)}${i.use?'（'+esc(i.use)+'）':''}</option>`).join('')}
function addLine(itemId=''){
 const d=document.createElement('div');d.className='line';
 d.innerHTML=`<select class="lItem">${itemOptions(itemId)}</select><input class="lQty" type="number" inputmode="numeric" min="0"><input class="lPrice" type="number" inputmode="numeric" min="0" placeholder="単価"><button type="button" class="lDel danger sm">×</button><div class="lInfo"></div>`;
 d.querySelector('.lItem').onchange=()=>{d.querySelector('.lPrice').value='';refreshLine(d);calcPreview()};
 d.querySelector('.lDel').onclick=()=>{d.remove();calcPreview()};
 $('#lines').appendChild(d);refreshLine(d);
}
function refreshLine(d){
 const id=d.querySelector('.lItem').value,it=DB.items.find(i=>i.id===id),p=d.querySelector('.lPrice');
 d.querySelector('.lInfo').textContent=it?`現在庫 ${stockMap()[id]||0}枚${curType==='社外販売'?'　単価は税抜':''}`:'';
 if(it&&p.value==='')p.value=Number(it.price)||'';
 p.style.display=curType==='社外販売'?'':'none';
 d.querySelector('.lQty').placeholder=curType==='棚卸調整'?'実数':'枚数';
}
function setType(t){
 curType=t;$$('#typeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.type===t));
 $('#saleBox').style.display=$('#moneyBox').style.display=t==='社外販売'?'':'none';
 $('#dateLabel').textContent=t==='社外販売'?'注文受付日':'日付';
 $('#linesLabel').textContent=t==='棚卸調整'?'品目と実際に数えた枚数（空欄は変更なし）':'品目と枚数';
 if(t==='棚卸調整'){$('#lines').innerHTML='';items().forEach(i=>addLine(i.id))}
 else{ if(!$$('.line').length||($$('.line').length===DB.items.length&&$$('.lQty').every(x=>x.value===''))){$('#lines').innerHTML='';addLine()} $$('.line').forEach(refreshLine)}
 shipChanged();
}
function shipChanged(){
 const deliv=$('#eShip').value==='宅配便で発送';
 $('#feeBox').style.visibility=deliv?'visible':'hidden';
 $('#delivBox').style.display=$('#eShip').value==='来店引取（無料）'?'none':'';
 if(deliv&&$('#eFee').value===''&&cfg.fee!=='')$('#eFee').value=cfg.fee;
 calcPreview();
}
function curFee(){return $('#eShip').value==='宅配便で発送'?Number($('#eFee').value||0):0}
function calcPreview(){
 if(curType!=='社外販売')return;
 const goods=$$('.line').reduce((s,d)=>s+Number(d.querySelector('.lQty').value||0)*Number(d.querySelector('.lPrice').value||0),0);
 const m=money(goods,curFee());
 $('#mGoods').textContent=yen(m.goods);$('#mFee').textContent=yen(m.fee);$('#mSub').textContent=yen(m.sub);$('#mTax').textContent=yen(m.tax);$('#mTotal').textContent=yen(m.total);
}
const normTel=s=>String(s||'').replace(/[^0-9]/g,'');
function findCust(name){name=String(name||'').trim();return name?DB.customers.find(c=>c.name===name):null}
function fillCustomer(){
 const c=findCust($('#eCustomer').value);
 $('#custHit').style.display=c?'':'none';
 if(!c)return;
 $('#eTel').value=c.tel||'';$('#eAddr').value=c.address||'';
 if(c.note&&!$('#eNote').value)$('#eNote').value=c.note;
}
function fillByTel(){
 const t=normTel($('#eTel').value);if(t.length<9||$('#eCustomer').value.trim())return;
 const c=DB.customers.find(x=>normTel(x.tel)===t);if(!c)return;
 $('#eCustomer').value=c.name;if(!$('#eAddr').value)$('#eAddr').value=c.address||'';$('#custHit').style.display='';
}
function resetEntry(){$('#custHit').style.display='none';['eCustomer','eTel','eAddr','eNote','eFee','eDelivDate','eDelivTime'].forEach(id=>$('#'+id).value='');$$('#saleBox input[type=checkbox]').forEach(c=>c.checked=false);$('#lines').innerHTML='';setType(curType)}

async function saveEntry(){
 const type=curType,date=$('#eDate').value||today(),st=stockMap(),slip=makeSlip(),created=nowStr(),sale=type==='社外販売';
 const S={customer:$('#eCustomer').value.trim(),tel:$('#eTel').value.trim(),address:$('#eAddr').value.trim(),channel:$('#eChannel').value,receiver:$('#eReceiver').value.trim(),
  ship:$('#eShip').value,shipFee:curFee(),deliverDate:$('#eDelivDate').value,deliverTime:$('#eDelivTime').value.trim(),pay:$('#ePay').value,docs:$$('#saleBox input[type=checkbox]:checked').map(c=>c.value).join('・')};
 if(sale&&!S.customer){alert('顧客名を入力してください');return}
 if(sale&&S.ship==='宅配便で発送'&&$('#eFee').value===''&&!confirm('送料が空欄です（0円で登録）。よろしいですか？'))return;
 const rows=[],over=[];
 for(const d of $$('.line')){
  const id=d.querySelector('.lItem').value,v=d.querySelector('.lQty').value;
  if(!id||v==='')continue;
  const it=DB.items.find(i=>i.id===id);let q=Number(v);
  if(!(q>=0)){alert('枚数が正しくありません');return}
  if(type==='棚卸調整'){q=q-(st[id]||0);if(q===0)continue}
  else{if(q===0)continue;q=q*SIGN[type];if(q<0&&(st[id]||0)+q<0)over.push(it.model)}
  const r={id:uid(),slip,date,type,itemId:id,model:it.model,qty:q,price:'',customer:'',pay:'',docs:'',paid:'',staff:cfg.staff||'',note:$('#eNote').value.trim(),created,
   channel:'',receiver:'',tel:'',address:'',ship:'',shipFee:'',shipped:'',sentOffice:'',deliverDate:'',deliverTime:''};
  if(sale)Object.assign(r,S,{price:Number(d.querySelector('.lPrice').value||0),shipFee:rows.length?0:S.shipFee,
   paid:PAID_NOW.includes(S.pay)?'済':'未',shipped:S.ship==='来店引取（無料）'?'済':'未'});
  rows.push(r);
 }
 if(!rows.length){alert(type==='棚卸調整'?'在庫との差がありません':'品目と枚数を入力してください');return}
 if(over.length&&!confirm(`${over.join('、')} の在庫がマイナスになります。登録しますか？`))return;
 let customer=null;const newCust=sale&&!findCust(S.customer);
 if(sale){
  const ex=findCust(S.customer);
  customer=ex?Object.assign({},ex,{tel:S.tel||ex.tel,address:S.address||ex.address,updated:today()})
   :{id:uid(),name:S.customer,kana:'',tel:S.tel,address:S.address,note:'',updated:today()};
  if(ex&&ex.tel===customer.tel&&ex.address===customer.address)customer=null;
 }
 try{await api('addSlip',customer?{rows,customer}:{rows});toast(type+'を登録しました'+(newCust?'（顧客台帳にも登録）':''));resetEntry();renderAll();
  if(sale&&S.ship===CITY)showLine(slip);
 }catch(e){}
}

/* ----- 履歴 ----- */
function renderHist(){
 const ft=$('#hType').value,fs=$('#hState').value,q=$('#hQ').value.trim();
 const list=slips().filter(r=>{
  const h=r[0];
  if(ft&&h.type!==ft)return false;
  if(fs){if(!isSale(r))return false;if(fs==='ship'&&h.shipped==='済')return false;if(fs==='paid'&&h.paid==='済')return false;if(fs==='sent'&&h.sentOffice)return false}
  return !q||r.some(t=>[t.customer,t.model,t.slip].join(' ').includes(q));
 });
 $('#histList').innerHTML=list.slice(0,150).map(r=>{
  const h=r[0],sale=isSale(r);
  const lines=r.map(t=>{const n=Number(t.qty);return `<li>${esc(t.model)}　${h.type==='棚卸調整'?(n>0?'+':'')+n:Math.abs(n)}枚${sale?` × ${yen(t.price)}`:''}</li>`}).join('');
  let saleInfo='';
  if(sale){
   const m=slipMoney(r);
   saleInfo=`<div style="margin-top:4px"><b>${esc(h.customer)}</b> 様　<span class="sub">${esc(h.tel)}</span></div>
   ${h.address?`<div class="sub">${esc(h.address)}</div>`:''}
   <div class="sub">受付：${esc(h.channel)}${h.receiver?'（'+esc(h.receiver)+'）':''}　配送：${esc(h.ship)}${h.deliverDate||h.deliverTime?'　配達 '+esc(jpDate(h.deliverDate))+' '+esc(h.deliverTime):''}　支払：${esc(h.pay)}</div>
   <ul>${lines}${m.fee?`<li>送料　${yen(m.fee)}</li>`:''}</ul>
   <div class="money" style="font-size:14px"><span>税抜金額</span><span>${yen(m.sub)}</span><span>消費税（10%）</span><span>${yen(m.tax)}</span><span><b>合計</b></span><span><b>${yen(m.total)}</b></span></div>
   <div class="sub" style="margin-top:4px">事務所で作成：${esc(h.docs)||'なし'}</div>`;
  }
  return `<div class="card slip">
   <div class="row"><span class="badge ${TCLS[h.type]}">${esc(h.type)}</span><b>${esc(h.date)}</b>
   ${sale?`<span class="badge ${h.shipped==='済'?'b-ok':'b-warn'}">${shipWord(h)}${h.shipped==='済'?'済':'前'}</span><span class="badge ${h.paid==='済'?'b-ok':'b-warn'}">${h.paid==='済'?'入金済':'未入金'}</span><span class="badge ${h.sentOffice?'b-ok':'b-gray'}">${h.sentOffice?'事務所送付済':'事務所未送付'}</span>`:''}</div>
   ${sale?saleInfo:`<ul>${lines}</ul>`}
   <div class="sub">No.${esc(h.slip)}${h.staff?'　担当 '+esc(h.staff):''}${h.note?'　'+esc(h.note):''}</div>
   <div class="btns">
    ${sale&&h.ship===CITY?`<button class="sm line-btn" data-act="line" data-slip="${esc(h.slip)}">LINE指示</button>`:''}
    ${sale?`<button class="sm" data-act="ship" data-slip="${esc(h.slip)}">${h.shipped==='済'?shipWord(h)+'前に戻す':shipWord(h)+'済にする'}</button>
    <button class="sm" data-act="paid" data-slip="${esc(h.slip)}">${h.paid==='済'?'未入金に戻す':'入金済にする'}</button>`:''}
    <button class="sm danger" data-act="del" data-slip="${esc(h.slip)}">削除</button>
   </div></div>`;
 }).join('')||'<div class="card sub">履歴はありません</div>';
}
async function histAction(e){
 const b=e.target.closest('button[data-act]');if(!b)return;
 const slip=b.dataset.slip,h=DB.tx.find(t=>t.slip===slip);
 try{
  if(b.dataset.act==='line'){showLine(slip);return}
  if(b.dataset.act==='ship'){await api('updateSlip',{slip,fields:{shipped:h.shipped==='済'?'未':'済'}});renderAll()}
  else if(b.dataset.act==='paid'){await api('updateSlip',{slip,fields:{paid:h.paid==='済'?'未':'済'}});renderAll()}
  else if(b.dataset.act==='del'){if(!confirm('この伝票を削除しますか？在庫も元に戻ります。'))return;await api('deleteSlip',{slip});toast('削除しました');renderAll()}
 }catch(err){}
}

/* ----- Excel ----- */
function exportTarget(){
 const from=$('#xFrom').value||'0000',to=$('#xTo').value||'9999',unsent=$('#xUnsent').checked;
 const inRange=r=>String(r[0].date)>=from&&String(r[0].date)<=to;
 const all=slips().filter(inRange).reverse();
 const sales=all.filter(r=>isSale(r)&&(!unsent||!r[0].sentOffice));
 return {from,to,all,sales};
}
function buildSheets(t){
 const st=stockMap(),useOf=id=>(DB.items.find(i=>i.id===id)||{}).use||'';
 const S=[['伝票番号','受注日','受付経路','受付者','顧客名','電話','住所・お届け先','配送方法','配達日時','型式','用途','枚数','単価(税抜)','金額(税抜)','送料(税抜)','税抜金額','消費税(10%)','合計金額','支払方法','事務所で作成する書類','発送','入金','担当','備考']];
 t.sales.forEach(r=>{const m=slipMoney(r);r.forEach((x,i)=>{const q=Math.abs(Number(x.qty)),p=Number(x.price||0);const f=i===0;
  S.push([x.slip,x.date,f?x.channel:'',f?x.receiver:'',x.customer,f?x.tel:'',f?x.address:'',f?x.ship:'',f?[x.deliverDate,x.deliverTime].filter(Boolean).join(' '):'',x.model,useOf(x.itemId),q,p,q*p,f?m.fee:'',f?m.sub:'',f?m.tax:'',f?m.total:'',f?x.pay:'',f?x.docs:'',f?(x.shipped==='済'?'済':'未'):'',f?(x.paid==='済'?'済':'未'):'',f?x.staff:'',f?x.note:''])})});
 if(t.sales.length){const tot=t.sales.map(slipMoney).reduce((a,m)=>({sub:a.sub+m.sub,tax:a.tax+m.tax,total:a.total+m.total}),{sub:0,tax:0,total:0});S.push([]);S.push(['合計','','','','','','','','','','','','','','',tot.sub,tot.tax,tot.total])}
 const H=[['伝票番号','日付','区分','型式','用途','増減枚数','顧客名','担当','備考']];
 t.all.forEach(r=>r.forEach(x=>H.push([x.slip,x.date,x.type,x.model,useOf(x.itemId),Number(x.qty),x.customer||'',x.staff||'',x.note||''])));
 const Z=[['型式','用途','在庫枚数','発注点','状態']];
 items().forEach(i=>{const n=st[i.id]||0;Z.push([i.model,i.use||'',n,Number(i.reorder)||0,Number(i.reorder)>0&&n<=Number(i.reorder)?'要発注':''])});
 const C=[['顧客名','ふりがな','電話','住所・お届け先','備考']];
 sortedCust().forEach(c=>C.push([c.name,c.kana||'',c.tel||'',c.address||'',c.note||'']));
 return {'販売一覧':S,'入出庫履歴':H,'在庫一覧':Z,'顧客台帳':C};
}
function fileName(t){return `資材販売_${t.from.replace(/-/g,'')}-${t.to.replace(/-/g,'')}`}
function downloadXlsx(){
 if(!window.XLSX){alert('Excel機能を読み込めませんでした。通信状態を確認してください。');return}
 const t=exportTarget(),sh=buildSheets(t),wb=XLSX.utils.book_new();
 Object.entries(sh).forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n));
 XLSX.writeFile(wb,fileName(t)+'.xlsx');
}
async function mailOffice(){
 if(!cfg.url){alert('メール送信はスプレッドシート連携時のみ使えます');return}
 if(!cfg.office){alert('設定で事務所のメールアドレスを入力してください');return}
 const t=exportTarget();
 if(!t.sales.length&&!confirm('対象の販売がありません。入出庫履歴と在庫一覧だけ送りますか？'))return;
 const m=t.sales.map(slipMoney).reduce((a,x)=>a+x.total,0);
 if(!confirm(`${cfg.office} へ\n販売 ${t.sales.length}件（合計 ${yen(m)}）を送信します。`))return;
 const body=`事務所 御中\n\n資材（トラクター爪）の販売・在庫データを送付します。\n期間：${t.from} 〜 ${t.to}\n販売：${t.sales.length}件　合計（税込）${yen(m)}\n\n「事務所で作成する書類」欄の書類（見積書・納品書・請求書・領収書）の作成をお願いします。\n\n${cfg.staff||''}`;
 try{await api('sendOffice',{email:cfg.office,subject:fileName(t),body,sheets:buildSheets(t),slips:t.sales.map(r=>r[0].slip)});toast('事務所へ送信しました');renderAll()}catch(e){}
}

/* ----- LINE指示 ----- */
const CITY='市内配達（自社・無料）';
const WD='日月火水木金土';
function jpDate(s){if(!s)return '';const d=new Date(String(s)+'T00:00:00');return isNaN(d)?String(s):`${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`}
function shipWord(h){return h.ship===CITY?'配達':h.ship==='来店引取（無料）'?'引渡':'発送'}
function lineText(slip){
 const r=DB.tx.filter(t=>t.slip===slip),h=r[0],m=slipMoney(r),docs=String(h.docs||'');
 const useOf=id=>(DB.items.find(i=>i.id===id)||{}).use||'';
 const yn=k=>docs.includes(k)?'要':'不要';
 const pay=h.pay==='代引き'?`代引き　${yen(m.total)}（税込）を集金してください`:h.pay;
 return ['【市内配達のお願い】',
  `■注文受付日：${jpDate(h.date)}（${h.channel}${h.receiver?'／受付 '+h.receiver:''}）`,
  `■ご注文者：${h.customer} 様`,
  h.tel?`■電話：${h.tel}`:null,
  `■配達日時：${jpDate(h.deliverDate)||'未定'} ${h.deliverTime||''}`.trim(),
  `■配達先：${h.address||'（未入力）'}`,
  '■品目：トラクターの爪',
  ...r.map(t=>{const u=useOf(t.itemId);return `　・${t.model}${u?'（'+u+'）':''} × ${Math.abs(Number(t.qty))}枚`}),
  `■お支払い：${pay}`,
  `■請求書：${yn('請求書')}`,
  `■領収書：${yn('領収書')}`,
  docs.includes('納品書')?'■納品書：要':null,
  h.note?`■備考：${h.note}`:null,
  `伝票No.${h.slip}`].filter(x=>x!==null).join('\n');
}
function showLine(slip){$('#lineText').value=lineText(slip);$('#lineWrap').classList.add('on')}
async function copyLine(){
 const t=$('#lineText').value;
 try{await navigator.clipboard.writeText(t);toast('コピーしました。LINEに貼り付けてください');return}catch(e){}
 const ta=$('#lineText');ta.focus();ta.select();ta.setSelectionRange(0,t.length);
 let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 ta.blur();toast(ok?'コピーしました。LINEに貼り付けてください':'選択されている文章を長押ししてコピーしてください');
}

function resetCustForm(){['cuId','cuName','cuKana','cuTel','cuAddr','cuNote'].forEach(k=>$('#'+k).value='');$('#cuFormTitle').textContent='顧客を登録';$('#cancelCust').style.display='none'}
async function saveCust(){
 const name=$('#cuName').value.trim();if(!name){alert('顧客名を入力してください');return}
 const id=$('#cuId').value,dup=DB.customers.find(c=>c.name===name&&c.id!==id);
 if(dup){alert('同じ名前の顧客が登録済みです');return}
 const old=DB.customers.find(c=>c.id===id);
 const customer={id:id||uid(),name,kana:$('#cuKana').value.trim(),tel:$('#cuTel').value.trim(),address:$('#cuAddr').value.trim(),note:$('#cuNote').value.trim(),updated:today()};
 try{await api('saveCustomer',{customer,oldName:old&&old.name!==name?old.name:''});toast('保存しました');resetCustForm();renderAll()}catch(e){}
}
async function custAction(e){
 const b=e.target.closest('button[data-cuact]');if(!b)return;
 const c=DB.customers.find(x=>x.id===b.dataset.id);if(!c)return;
 if(b.dataset.cuact==='edit'){$('#cuId').value=c.id;$('#cuName').value=c.name;$('#cuKana').value=c.kana||'';$('#cuTel').value=c.tel||'';$('#cuAddr').value=c.address||'';$('#cuNote').value=c.note||'';
  $('#cuFormTitle').textContent='顧客を編集';$('#cancelCust').style.display='';$('#cuName').scrollIntoView({behavior:'smooth',block:'center'})}
 else if(b.dataset.cuact==='del'){if(!confirm(c.name+' を台帳から削除しますか？（販売履歴は残ります）'))return;try{await api('deleteCustomer',{id:c.id});renderAll()}catch(err){}}
 else if(b.dataset.cuact==='sell'){goTab('entry');setType('社外販売');$('#eCustomer').value=c.name;fillCustomer()}
}

/* ---------- 設定 ---------- */
const CF={cUrl:'url',cKey:'key',cStaff:'staff',cOffice:'office',cFee:'fee'};
function loadCfgForm(){Object.entries(CF).forEach(([id,k])=>$('#'+id).value=cfg[k]||'')}
async function saveCfg(){
 Object.entries(CF).forEach(([id,k])=>cfg[k]=$('#'+id).value.trim());
 LS.set('shizai_cfg',cfg);
 try{await api('getAll');renderAll();toast('保存しました')}catch(e){}
}

/* ---------- アイコン・PWA ---------- */
function makeIcon(){
 const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
 x.fillStyle='#2f6b3a';x.beginPath();x.roundRect?x.roundRect(0,0,512,512,96):x.rect(0,0,512,512);x.fill();
 x.fillStyle='#fff';x.font='bold 300px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('爪',256,240);
 x.font='bold 70px sans-serif';x.fillText('在庫',256,430);
 const url=c.toDataURL('image/png');$('#appleIcon').href=url;
 const mf={name:'資材販売・在庫管理',short_name:'資材在庫',start_url:location.href.split('#')[0],display:'standalone',background_color:'#f4f6f2',theme_color:'#2f6b3a',icons:[{src:url,sizes:'512x512',type:'image/png'}]};
 $('#manifestLink').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));
}

/* ---------- 初期化 ---------- */
function goTab(t){$$('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));$$('section').forEach(s=>s.classList.toggle('on',s.id==='tab-'+t));window.scrollTo(0,0)}
$$('nav button').forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
$$('#typeSeg button').forEach(b=>b.onclick=()=>setType(b.dataset.type));
$('#addLine').onclick=()=>addLine();
$('#lines').addEventListener('input',calcPreview);
$('#eFee').oninput=calcPreview;
$('#eShip').onchange=shipChanged;
$('#eCustomer').oninput=fillCustomer;
$('#eTel').onchange=fillByTel;
$('#cuQ').oninput=renderCustList;
$('#custListView').onclick=custAction;
$('#saveCust').onclick=saveCust;
$('#cancelCust').onclick=resetCustForm;
$('#saveEntry').onclick=saveEntry;
$('#saveItem').onclick=saveItem;
$('#cancelItem').onclick=resetItemForm;
$('#itemList').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.edit)editItem(b.dataset.edit);if(b.dataset.delitem)delItem(b.dataset.delitem)};
$('#saveCfg').onclick=saveCfg;
$('#histList').onclick=histAction;
$('#xDownload').onclick=downloadXlsx;
$('#xMail').onclick=mailOffice;
$('#lineCopy').onclick=copyLine;
$('#lineSend').onclick=()=>{location.href='https://line.me/R/share?text='+encodeURIComponent($('#lineText').value)};
$('#lineClose').onclick=()=>$('#lineWrap').classList.remove('on');
$('#lineWrap').onclick=e=>{if(e.target.id==='lineWrap')$('#lineWrap').classList.remove('on')};
['hType','hState'].forEach(id=>$('#'+id).onchange=renderHist);
$('#hQ').oninput=renderHist;
(()=>{const d=new Date();$('#xFrom').value=ymd(new Date(d.getFullYear(),d.getMonth(),1));$('#xTo').value=today()})();
$('#eDate').value=today();
makeIcon();loadCfgForm();renderAll();setType('入荷');
api('getAll').then(()=>{renderAll();if(!$$('.lQty').some(x=>x.value))setType(curType)}).catch(()=>{});
</script>
